# Veille de dépendances.
#
# Une messagerie qui promet la confidentialité ne peut pas se permettre de
# tourner sur des dépendances dont les correctifs de sécurité s'accumulent
# ailleurs. Le rythme est hebdomadaire : assez pour ne pas dériver, assez peu
# pour que les propositions restent lisibles et soient réellement relues.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci'

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'back'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'front'
    groups:
      # Les outils de construction et de test évoluent souvent ensemble et
      # n'atteignent jamais une instance : les regrouper évite d'ouvrir cinq
      # propositions par semaine pour des paquets qui ne sortent pas de la
      # machine de construction.
      outillage:
        dependency-type: development

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'image'
