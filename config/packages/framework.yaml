# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session:
        # Les sessions vivent dans le volume de donnees, JAMAIS sous cache_dir : celui-ci est
        # reconstruit a chaque demarrage du conteneur, ce qui deconnectait tout le monde a
        # chaque mise a jour de l'instance.
        save_path: '%env(resolve:LOCKET_SESSION_DIR)%'
        cookie_secure: auto
        cookie_samesite: lax
        cookie_httponly: true

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
