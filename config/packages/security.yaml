security:
    password_hashers:
        # Argon2id : le PIN est court, le cout du hachage est la seule chose qui rende une
        # attaque hors ligne couteuse si la base fuite.
        App\Entity\User:
            algorithm: argon2id

    providers:
        locket_users:
            id: App\Repository\UserRepository

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: locket_users
            # Session liee a un appareil : le deviceId est pose en session par l'authenticator
            # et revalide a chaque requete (voir App\Security\DeviceContext).
            custom_authenticators:
                - App\Security\PinAuthenticator
            entry_point: App\Security\JsonAuthenticationEntryPoint

    # Seul le premier motif correspondant s'applique : les exceptions anonymes doivent donc
    # rester AVANT la regle generale sur ^/api.
    access_control:
        - { path: ^/setup, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/invites/claim$, roles: PUBLIC_ACCESS }
        - { path: ^/api/push/vapid-public-key$, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: ROLE_USER }
        - { path: ^/admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            # Parametres minimaux : les tests exercent la logique, pas le cout du hachage.
            App\Entity\User:
                algorithm: argon2id
                time_cost: 3
                memory_cost: 10
