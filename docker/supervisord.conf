; Supervision des processus du conteneur Locket.
;
; POURQUOI un superviseur dans un conteneur unique : Locket a besoin de DEUX
; processus de longue durée, et pas d'un seul.
;
;   1. le serveur FrankenPHP ;
;   2. un consommateur Messenger, qui envoie les notifications push et déclenche
;      la purge horaire du Scheduler.
;
; Sans le second, deux fonctionnalités entières sont mortes en production : aucune
; notification n'est jamais envoyée, et rien n'est jamais purgé — la promesse des
; sept jours ne tient plus.
;
; Les alternatives ont été écartées : lancer le consommateur en arrière-plan
; depuis l'entrypoint le laisse mourir sans être relancé et sans que le conteneur
; passe en échec ; un cron externe ajoute un service à superviser, ce que
; l'installation « une seule commande » exclut. Supervisor redémarre chaque
; programme, relaie les journaux sur la sortie standard du conteneur, et arrête
; tout proprement au SIGTERM.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=warn

[program:frankenphp]
command=frankenphp run --config /etc/frankenphp/Caddyfile
directory=/app
autostart=true
autorestart=true
startretries=10
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:messenger]
; `async` porte les notifications push, `scheduler_default` les déclencheurs du
; Scheduler (purge horaire). Le redémarrage périodique par --time-limit est une
; hygiène classique d'un worker PHP de longue durée : il rend toute fuite de
; mémoire ou tout état résiduel sans conséquence.
command=php /app/bin/console messenger:consume async scheduler_default --time-limit=3600 --memory-limit=128M --no-interaction --quiet
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=20
; 0 est le code de sortie normal quand --time-limit est atteint : ce n'est pas un échec.
exitcodes=0
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
